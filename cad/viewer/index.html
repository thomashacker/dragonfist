<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DragonFist – 3D-Ansicht</title>
<style>
  :root { --bg:#f3f2ee; --panel:#ffffff; --ink:#1d1d1b; --dim:#6b6a66; --line:#d9d7cf; --acc:#b4541a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1b1a; --panel:#262624; --ink:#ecebe6; --dim:#9c9a92; --line:#3a3a37; --acc:#e8915a; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  #app { display:flex; height:100%; }
  #side { width:290px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:14px; }
  #view { flex:1; position:relative; min-width:0; }
  canvas { display:block; width:100%; height:100%; }
  h1 { font-size:16px; margin:0 0 2px; }
  h2 { font-size:12px; margin:18px 0 6px; color:var(--dim); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  p.hint { margin:0; color:var(--dim); font-size:12px; }
  label.row { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  label.row span.n { color:var(--dim); margin-left:auto; font-size:12px; }
  button, select { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  input[type=range] { width:100%; }
  #info, #mess { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:13px; min-height:38px; }
  #info b, #mess b { display:block; }
  .dim { color:var(--dim); }
  #lade { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); pointer-events:none; }
  #tipp { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px; pointer-events:none; }
  @media (max-width: 700px) { #app { flex-direction:column-reverse; } #side { width:auto; max-height:45%; border-right:0; border-top:1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>DragonFist</h1>
    <p class="hint">Stand des CAD-Modells: <span id="stand">–</span></p>

    <h2>Baugruppen</h2>
    <div id="stufen"></div>
    <div class="btns" style="margin-top:8px"><button id="alle">Alles zeigen</button></div>

    <h2>Ausgewähltes Teil</h2>
    <div id="info"><span class="dim">Teil anklicken</span></div>
    <div class="btns" style="margin-top:8px">
      <button id="weg">Ausblenden</button>
      <button id="nur">Nur dieses</button>
      <button id="zoom">Heranzoomen</button>
    </div>

    <h2>Messen</h2>
    <div class="btns">
      <button id="messen">Messen an</button>
      <label class="row" style="padding:0"><input type="checkbox" id="snap" checked> an Ecken einrasten</label>
    </div>
    <div id="mess" style="margin-top:8px"><span class="dim">Einschalten, dann zwei Punkte anklicken</span></div>

    <h2>Schnitt</h2>
    <div class="btns">
      <select id="achse">
        <option value="">kein Schnitt</option>
        <option value="x">von links nach rechts</option>
        <option value="y">von unten nach oben</option>
        <option value="z">von vorne nach hinten</option>
      </select>
      <button id="dreh">Seite wechseln</button>
    </div>
    <input type="range" id="pos" min="0" max="1000" value="500" style="margin-top:8px">

    <h2>Ansicht</h2>
    <div class="btns">
      <button data-v="iso">Schräg</button>
      <button data-v="vorn">Vorne</button>
      <button data-v="hinten">Hinten</button>
      <button data-v="seite">Seite</button>
      <button data-v="oben">Oben</button>
    </div>
  </div>
  <div id="view">
    <div id="lade">Modell wird geladen …</div>
    <div id="tipp">Ziehen: drehen · Rechte Maustaste: verschieben · Mausrad: zoomen</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const STUFEN = [
  ['1_Rahmen', 'Holzkiste'],
  ['2_Lichtsensoren', 'Lichtsensoren'],
  ['3_Sensorkaefig', 'Sensorkäfig'],
  ['4_Schrauben', 'Schrauben'],
  ['5_Elektronik_und_Kabel', 'Elektronik und Kabel'],
  ['6_LEDs_und_Deckel', 'LEDs und Deckel'],
  ['7_Bedienpult', 'Bedienpult'],
];
const $ = id => document.getElementById(id);
const view = $('view');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
view.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(dark ? 0x1b1b1a : 0xf3f2ee);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.6));
const sonne = new THREE.DirectionalLight(0xffffff, 1.8);
sonne.position.set(1, 2, 1.5);
scene.add(sonne);

const cam = new THREE.PerspectiveCamera(35, 1, 0.005, 50);
const lampe = new THREE.DirectionalLight(0xffffff, 1.2);
cam.add(lampe);
scene.add(cam);
const ctl = new OrbitControls(cam, renderer.domElement);
ctl.enableDamping = true;
ctl.dampingFactor = 0.12;

const modell = new THREE.Group();
scene.add(modell);
const box = new THREE.Box3(), mitte = new THREE.Vector3(), groesse = new THREE.Vector3();
const plane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
let schnitt = '', richtung = 1, wahl = null, rahmen = null;
const gruppen = [];

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

function blick(v, ziel = mitte, r = groesse.length()) {
  const d = { iso: [0.9, 0.55, 1.2], vorn: [0, 0, 1], hinten: [0, 0, -1], seite: [1, 0, 0], oben: [0, 1, 0.001] }[v];
  const dist = r * 0.5 / Math.tan(cam.fov * Math.PI / 360) * 1.25;
  cam.position.copy(ziel).add(new THREE.Vector3(...d).normalize().multiplyScalar(dist));
  ctl.target.copy(ziel);
  ctl.update();
}

const mm = v => (v * 1000).toFixed(1).replace('.', ',');

function teilVon(obj) {
  while (obj && !obj.userData.teil) obj = obj.parent;
  return obj;
}

function waehle(t) {
  wahl = t;
  if (rahmen) { scene.remove(rahmen); rahmen.dispose?.(); rahmen = null; }
  if (!t) { $('info').innerHTML = '<span class="dim">Teil anklicken</span>'; return; }
  rahmen = new THREE.BoxHelper(t, 0xff7a1a);
  scene.add(rahmen);
  const b = new THREE.Box3().setFromObject(t), s = b.getSize(new THREE.Vector3());
  $('info').innerHTML = `<b>${t.userData.name}</b><span class="dim">${t.userData.stufe}</span><br>` +
    `Breite ${mm(s.x)} · Höhe ${mm(s.y)} · Tiefe ${mm(s.z)} mm`;
}

function sichtbar(o) {
  for (; o; o = o.parent) if (!o.visible) return false;
  return true;
}

const ray = new THREE.Raycaster(), maus = new THREE.Vector2();
function treffer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  maus.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(maus, cam);
  return ray.intersectObject(modell, true).find(h =>
    h.object.isMesh && sichtbar(h.object) && (!schnitt || plane.distanceToPoint(h.point) >= 0));
}

const punkte = [], marken = new THREE.Group();
scene.add(marken);
let messen = false;
function messpunkt(h) {
  let p = h.point.clone();
  if ($('snap').checked && h.face) {
    const pos = h.object.geometry.attributes.position;
    let best = null, bd = 0.004;
    for (const i of [h.face.a, h.face.b, h.face.c]) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(h.object.matrixWorld);
      const d = v.distanceTo(h.point);
      if (d < bd) { bd = d; best = v; }
    }
    if (best) p = best;
  }
  if (punkte.length === 2) { punkte.length = 0; marken.clear(); }
  punkte.push(p);
  const k = new THREE.Mesh(new THREE.SphereGeometry(groesse.length() * 0.004, 12, 8),
    new THREE.MeshBasicMaterial({ color: 0xff2d55, depthTest: false }));
  k.position.copy(p);
  k.renderOrder = 10;
  marken.add(k);
  if (punkte.length === 1) { $('mess').innerHTML = '<span class="dim">Zweiten Punkt anklicken</span>'; return; }
  const [a, b] = punkte;
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]),
    new THREE.LineBasicMaterial({ color: 0xff2d55, depthTest: false }));
  l.renderOrder = 10;
  marken.add(l);
  $('mess').innerHTML = `<b>${mm(a.distanceTo(b))} mm</b>` +
    `<span class="dim">Breite ${mm(Math.abs(a.x - b.x))} · Höhe ${mm(Math.abs(a.y - b.y))} · Tiefe ${mm(Math.abs(a.z - b.z))} mm</span>`;
}

let unten = null;
renderer.domElement.addEventListener('pointerdown', e => { unten = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!unten || e.button !== 0 || Math.hypot(e.clientX - unten[0], e.clientY - unten[1]) > 4) return;
  const h = treffer(e);
  if (messen) { h && messpunkt(h); return; }
  waehle(h ? teilVon(h.object) : null);
});

$('messen').onclick = () => {
  messen = !messen;
  $('messen').classList.toggle('on', messen);
  $('messen').textContent = messen ? 'Messen aus' : 'Messen an';
  if (!messen) { punkte.length = 0; marken.clear(); $('mess').innerHTML = '<span class="dim">Einschalten, dann zwei Punkte anklicken</span>'; }
};
$('weg').onclick = () => { if (wahl) { wahl.visible = false; waehle(null); } };
$('nur').onclick = () => {
  if (!wahl) return;
  modell.traverse(o => { if (o.userData.teil) o.visible = o === wahl; });
};
$('zoom').onclick = () => {
  if (!wahl) return;
  const b = new THREE.Box3().setFromObject(wahl);
  blick('iso', b.getCenter(new THREE.Vector3()), Math.max(b.getSize(new THREE.Vector3()).length(), 0.03));
};
$('alle').onclick = () => {
  modell.traverse(o => { if (o.userData.teil) o.visible = true; });
  for (const g of gruppen) { g.obj.visible = !g.extra; g.box.checked = !g.extra; }
};
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => blick(b.dataset.v));

function schneiden() {
  schnitt = $('achse').value;
  const planes = schnitt ? [plane] : [];
  modell.traverse(o => { if (o.isMesh) for (const m of [].concat(o.material)) { m.clippingPlanes = planes; m.side = THREE.DoubleSide; } });
  if (!schnitt) return;
  const t = $('pos').value / 1000;
  const n = new THREE.Vector3(schnitt === 'x' ? 1 : 0, schnitt === 'y' ? 1 : 0, schnitt === 'z' ? 1 : 0);
  const p = box.min[schnitt] + (box.max[schnitt] - box.min[schnitt]) * t;
  plane.set(n.multiplyScalar(richtung), -richtung * p);
}
$('achse').onchange = schneiden;
$('pos').oninput = schneiden;
$('dreh').onclick = () => { richtung = -richtung; schneiden(); };

const lader = new GLTFLoader();
const geladen = await Promise.all(STUFEN.map(([datei, titel]) =>
  lader.loadAsync(`../ausgabe/stufen/${datei}.glb?t=${Date.now()}`).then(g => ({ g, titel, datei })).catch(() => null)));
for (const s of geladen) {
  if (!s) continue;
  const wurzel = s.g.scene;
  let n = 0;
  wurzel.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) { m.metalness = 0; m.roughness = 0.75; }
    const p = o.parent;
    const t = p !== wurzel && p.parent !== wurzel && p.children.every(c => c.isMesh) ? p : o;
    if (!t.userData.teil) { t.userData.teil = true; t.userData.stufe = s.titel; t.userData.name = t.userData.name || t.name; n++; }
  });
  modell.add(wurzel);
  const zeile = document.createElement('label');
  zeile.className = 'row';
  zeile.innerHTML = `<input type="checkbox" checked> ${s.titel} <span class="n">${n}</span>`;
  const cb = zeile.firstElementChild;
  cb.onchange = () => { wurzel.visible = cb.checked; if (wahl && !sichtbar(wahl)) waehle(null); };
  $('stufen').append(zeile);
  gruppen.push({ obj: wurzel, box: cb });
}
box.setFromObject(modell);
box.getCenter(mitte);
box.getSize(groesse);

const listen = {};
async function stlListe(ordner) {
  if (!listen[ordner]) {
    const html = await fetch(`../ausgabe/${ordner}/`, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '');
    listen[ordner] = [...html.matchAll(/href="([^"]+\.stl)"/g)].map(m => decodeURIComponent(m[1]));
  }
  return listen[ordner];
}

async function druckReihe(quellen, titel, farbe, versatz) {
  const namen = [];
  for (const [ordner, muster] of quellen)
    for (const n of await stlListe(ordner)) if (muster.test(n)) namen.push([ordner, n]);
  if (!namen.length) return;
  const reihe = new THREE.Group(), stl = new STLLoader();
  let x = 0;
  for (const [ordner, n] of namen) {
    const g = await stl.loadAsync(`../ausgabe/${ordner}/${encodeURIComponent(n)}?t=${Date.now()}`);
    g.computeBoundingBox();
    const b = g.boundingBox, m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: farbe, roughness: 0.75 }));
    m.scale.setScalar(0.001);
    m.rotation.x = -Math.PI / 2;
    m.position.set(x - b.min.x / 1000, -b.min.z / 1000, b.max.y / 1000);
    m.userData = { teil: true, name: n.replace('.stl', ''), stufe: titel };
    x += (b.max.x - b.min.x) / 1000 + 0.02;
    reihe.add(m);
  }
  reihe.position.set(box.min.x, box.min.y, box.max.z + versatz);
  reihe.visible = false;
  modell.add(reihe);
  const zeile = document.createElement('label');
  zeile.className = 'row';
  zeile.innerHTML = `<input type="checkbox"> ${titel} <span class="n">${namen.length}</span>`;
  const cb = zeile.firstElementChild;
  cb.onchange = () => { reihe.visible = cb.checked; if (wahl && !sichtbar(wahl)) waehle(null); };
  $('stufen').append(zeile);
  gruppen.push({ obj: reihe, box: cb, extra: true });
}
await druckReihe([['pruefdruck', /^[1236]_/]], 'Phase 1: Prüfdruck Käfig', 0xd8833b, 0.25);
await druckReihe([['druck', /^(Sensorplatte|Elektronik_Nest|Deckel)_/]], 'Phase 2: Käfig drucken', 0x3f7fd0, 0.55);
await druckReihe([['pruefdruck', /^[45]_/], ['druck', /^(Pult|Kabelkanal|Schild)_/]], 'Bonus: Pult, Schilder, Kabelkanal', 0x8a8a8a, 0.85);
fetch('../ausgabe/stufen/1_Rahmen.glb', { method: 'HEAD', cache: 'no-store' }).then(r => {
  const d = r.headers.get('last-modified');
  if (d) $('stand').textContent = new Date(d).toLocaleDateString('de-DE');
});
$('lade').remove();
resize();
blick('iso');
renderer.setAnimationLoop(() => { ctl.update(); rahmen?.update(); renderer.render(scene, cam); });
window.dbg = { modell, cam, gruppen, blick };
</script>
</body>
</html>
